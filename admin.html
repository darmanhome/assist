<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>پنل ادمین - دستیار درمانگر</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px; font-family: sans-serif; background: #f8fafc; color: #1e293b;
    direction: rtl;
  }
  h1 { font-size: 20px; color: #0f766e; }
  .card {
    background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px; margin-bottom: 12px;
  }
  input {
    width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; margin-bottom: 8px;
    font-size: 14px;
  }
  button {
    background: #0f766e; color: white; border: none; padding: 10px 16px; border-radius: 8px;
    font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #94a3b8; }
  button.small { padding: 6px 12px; font-size: 12px; }
  .error { color: #dc2626; font-size: 13px; margin-top: 6px; }
  .user-row {
    display: flex; justify-content: space-between; align-items: center; padding: 10px 0;
    border-bottom: 1px solid #f1f5f9;
  }
  .user-info { font-size: 13px; }
  .user-email { font-weight: bold; }
  .user-meta { color: #64748b; font-size: 11px; }
  .license-tag {
    display: inline-block; background: #ecfdf5; color: #047857; font-size: 11px;
    padding: 2px 6px; border-radius: 6px; margin-top: 4px;
  }
  #hidden-area { display: none; }
  .code-box {
    background: #ecfdf5; border: 1px solid #6ee7b7; padding: 10px; border-radius: 8px;
    margin-top: 8px; font-size: 14px; direction: ltr; text-align: center; font-weight: bold;
  }
</style>
</head>
<body>

<h1>🔐 پنل ادمین</h1>

<div id="login-area" class="card">
  <input id="admin-email" type="email" placeholder="ایمیل ادمین" dir="ltr" />
  <input id="admin-password" type="password" placeholder="رمز عبور" dir="ltr" />
  <button onclick="login()">ورود</button>
  <div id="login-error" class="error"></div>
</div>

<div id="hidden-area">
  <div class="card">
    <button onclick="loadUsers()">🔄 بروزرسانی لیست</button>
  </div>
  <div id="users-list"></div>
</div>

<script>
const SUPABASE_URL = "https://qhppfnyizqhgsiyelgxw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ASg9xC32lA7FjHAacXCouA_Fk4k3O30";
let accessToken = null;

async function login() {
  const email = document.getElementById("admin-email").value;
  const password = document.getElementById("admin-password").value;
  const errorEl = document.getElementById("login-error");
  errorEl.textContent = "";

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: "POST",
      headers: { apikey: SUPABASE_ANON_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ email, password }),
    });
    const data = await res.json();
    if (!res.ok) {
      errorEl.textContent = data.error_description || data.msg || "خطا در ورود";
      return;
    }
    accessToken = data.access_token;
    document.getElementById("login-area").style.display = "none";
    document.getElementById("hidden-area").style.display = "block";
    loadUsers();
  } catch (e) {
    errorEl.textContent = "خطای شبکه: " + e.message;
  }
}

async function loadUsers() {
  const listEl = document.getElementById("users-list");
  listEl.innerHTML = '<div class="card">در حال بارگذاری...</div>';

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/rapid-endpoint`, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ token: accessToken }),
    });
    const rawText = await res.text();
    let data;
    try { data = JSON.parse(rawText); } catch(e) { data = {}; }
    if (!res.ok) {
      listEl.innerHTML = `<div class="card error">کد: ${res.status}<br/>پیام: ${data.error || rawText || "نامشخص"}</div>`;
      return;
    }

    if (data.users.length === 0) {
      listEl.innerHTML = '<div class="card">هنوز کاربری ثبت‌نام نکرده.</div>';
      return;
    }

    listEl.innerHTML = data.users.map((u, i) => {
      const joinDate = new Date(u.created_at).toLocaleDateString("fa-IR");
      const licensesHtml = u.licenses.map(l => {
        const exp = new Date(l.expires_at).toLocaleDateString("fa-IR");
        return `<div class="license-tag">کد: ${l.code} — تا ${exp}</div>`;
      }).join("");

      return `
        <div class="card">
          <div class="user-row">
            <div class="user-info">
              <div class="user-email">${u.email || u.phone || "بدون ایمیل"}</div>
              ${u.phone ? `<div class="user-meta" dir="ltr" style="text-align:right;">${u.phone}</div>` : ""}
              <div class="user-meta">عضویت: ${joinDate}</div>
              ${licensesHtml}
            </div>
            <button class="small" onclick="generateCode('${u.email}', ${i})">تولید کد جدید</button>
          </div>
          <div id="code-result-${i}"></div>
        </div>
      `;
    }).join("");
  } catch (e) {
    listEl.innerHTML = `<div class="card error">خطای شبکه: ${e.message}</div>`;
  }
}

async function generateCode(email, index) {
  const resultEl = document.getElementById(`code-result-${index}`);
  resultEl.innerHTML = "در حال تولید کد...";

  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/issue-license`, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ token: accessToken, email: email }),
    });
    const data = await res.json();
    if (!res.ok) {
      resultEl.innerHTML = `<div class="error">${data.error || "خطا در تولید کد"}</div>`;
      return;
    }
    const exp = new Date(data.expires_at).toLocaleDateString("fa-IR");
    resultEl.innerHTML = `<div class="code-box">${data.code}</div><div class="user-meta" style="text-align:center;margin-top:4px;">اعتبار تا ${exp}</div>`;
  } catch (e) {
    resultEl.innerHTML = `<div class="error">خطای شبکه: ${e.message}</div>`;
  }
}
</script>

</body>
</html>
